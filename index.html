<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKATEN Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1000px;
    text-align:center;
}

.logo{
    font-size:clamp(60px,12vw,120px);
    font-weight:bold;
    user-select:none;
    margin-bottom:15px;
}

.b{color:#4285F4;}
.r{color:#EA4335;}
.y{color:#FBBC05;}
.g{color:#34A853;}

.subtitle{
    color:#666;
    font-size:18px;
    margin-bottom:35px;
}

.search-box{
    width:100%;
    max-width:700px;
    margin:auto;
}

.search-box input{
    width:100%;
    padding:18px 25px;
    border:none;
    border-radius:50px;
    font-size:18px;
    outline:none;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    transition:.2s;
}

.search-box input:focus{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.buttons{
    margin-top:25px;
}

button{
    border:none;
    background:#4285F4;
    color:white;
    padding:12px 24px;
    border-radius:12px;
    cursor:pointer;
    margin:5px;
    font-size:15px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.service-cards{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.service-card{
    width:360px;
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:15px;
    transition:.25s;
}

.service-card:hover{
    transform:translateY(-5px);
}

.icon{
    font-size:40px;
}

.youtube{
    border-left:6px solid #ff0000;
}

.discord{
    border-left:6px solid #5865F2;
}

.service-card h3{
    margin-bottom:5px;
}

.service-card > div:last-child{
    flex:1;
}

.service-card p{
    color:#666;
    font-size:14px;
    white-space:nowrap;
}

.section{
    margin-top:40px;
}

.section h2{
    margin-bottom:15px;
    color:#333;
}

.tags,
.history-list{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.tag,
.history-item{
    background:white;
    padding:10px 16px;
    border-radius:25px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    transition:.2s;
}

.tag:hover,
.history-item:hover{
    background:#4285F4;
    color:white;
}

footer{
    margin-top:50px;
    color:#888;
    font-size:14px;
}

@media(max-width:700px){

    .service-card{
        width:100%;
    }

    button{
        width:100%;
        max-width:360px;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<span class="b">W</span><span class="r">A</span><span class="y">K</span><span class="b">A</span><span class="g">T</span><span class="r">E</span><span class="b">N</span>
</div>

<div class="subtitle">
WAKATEN Search Engine
</div>

<form id="searchForm">

<div class="search-box">
<input
type="text"
id="search"
placeholder="WAKATENで検索"
autocomplete="off">
</div>

<div class="buttons">
<button type="submit">検索</button>
<button type="button" onclick="randomSearch()">ランダム検索</button>
</div>

</form>

<div class="service-cards">

<div class="service-card youtube" onclick="youtube()">
<div class="icon">▶</div>
<div>
<h3>YouTube</h3>
<p>わかてんチャンネルを開く</p>
</div>
</div>

<div class="service-card discord" onclick="discord()">
<div class="icon">💬</div>
<div>
<h3>Discord</h3>
<p>WAKATENコミュニティに参加</p>
</div>
</div>

</div>

<div class="section">

<h2>人気検索</h2>

<div class="tags">

<div class="tag" onclick="searchTag('YouTube')">YouTube</div>
<div class="tag" onclick="searchTag('AI')">AI</div>
<div class="tag" onclick="searchTag('ニュース')">ニュース</div>
<div class="tag" onclick="searchTag('ゲーム')">ゲーム</div>
<div class="tag" onclick="searchTag('天気')">天気</div>
<div class="tag" onclick="searchTag('プログラミング')">プログラミング</div>

</div>

</div>

<div class="section">

<h2>最近の検索</h2>

<div class="history-list" id="historyList"></div>

</div>

<footer>
WAKATEN Search © 2026
</footer>

</div>

<script>

const form=document.getElementById("searchForm");
const box=document.getElementById("search");

form.addEventListener("submit",e=>{
e.preventDefault();

const text=box.value.trim();

if(!text)return;

location.href=
"results.html?q="+
encodeURIComponent(text);
});

function searchTag(text){

location.href=
"results.html?q="+
encodeURIComponent(text);

}

function randomSearch(){

const words=[
"AI",
"宇宙",
"ゲーム",
"プログラミング",
"ニュース",
"音楽",
"日本",
"猫",
"天気",
"YouTube"
];

const word=
words[Math.floor(Math.random()*words.length)];

location.href=
"results.html?q="+
encodeURIComponent(word);

}

function youtube(){

window.open(
"https://www.youtube.com/@%E3%82%8F%E3%81%8B%E3%81%A6%E3%82%93%E3%83%81%E3%83%A3%E3%83%B3%E3%83%8D%E3%83%AB",
"_blank"
);

}

function discord(){

window.open(
"https://discord.gg/XhtVuksb8K",
"_blank"
);

}

const history=
JSON.parse(
localStorage.getItem("wakatenHistory")
||"[]"
);

const historyList=
document.getElementById("historyList");

history.slice(0,10).forEach(item=>{

const div=
document.createElement("div");

div.className=
"history-item";

div.textContent=
item;

div.onclick=()=>{

location.href=
"results.html?q="+
encodeURIComponent(item);

};

historyList.appendChild(div);

});

box.focus();

</script>

</body>
</html>
