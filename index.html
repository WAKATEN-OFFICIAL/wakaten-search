```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#00c853">

<title>WAKATEN Search</title>

<link rel="manifest" href="manifest.json">

<style>
:root{
    --main:#00c853;
    --bg:#ffffff;
    --text:#111111;
    --card:#f5f5f5;
}

body.dark{
    --bg:#111111;
    --text:#ffffff;
    --card:#1d1d1d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:260px;
    background:var(--card);
    padding:20px;
    border-right:1px solid rgba(0,0,0,.1);
}

.sidebar h2{
    color:var(--main);
    margin-bottom:20px;
}

.sidebar button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    background:var(--main);
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
}

.logo{
    font-size:80px;
    font-weight:700;
    color:var(--main);
    margin-bottom:30px;
}

.search-area{
    width:min(700px,90%);
}

.search-box{
    width:100%;
    padding:18px 24px;
    border-radius:40px;
    border:1px solid #ccc;
    font-size:18px;
    outline:none;
}

.search-box:focus{
    border-color:var(--main);
}

.tabs{
    margin-top:15px;
    display:flex;
    gap:10px;
    justify-content:center;
}

.tab{
    padding:10px 18px;
    border-radius:20px;
    background:var(--card);
    cursor:pointer;
}

.tab.active{
    background:var(--main);
    color:white;
}

.buttons{
    margin-top:25px;
}

.buttons button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:var(--main);
    color:white;
}

.shortcuts{
    margin-top:40px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.shortcut{
    width:120px;
    height:90px;
    background:var(--card);
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.history{
    margin-top:20px;
    font-size:14px;
}

.history div{
    padding:5px 0;
    cursor:pointer;
}

@media(max-width:900px){
    .sidebar{
        display:none;
    }

    .logo{
        font-size:52px;
    }
}
</style>
</head>

<body>

<div class="sidebar">

<h2>WAKATEN</h2>

<button onclick="toggleTheme()">🌙 ダークモード</button>
<button onclick="clearHistory()">🗑 履歴削除</button>

<div class="history">
<h3>検索履歴</h3>
<div id="historyList"></div>
</div>

</div>

<div class="main">

<div class="logo">WAKATEN</div>

<div class="search-area">

<form id="searchForm">

<input
class="search-box"
type="text"
id="search"
placeholder="WAKATENで検索">

</form>

<div class="tabs">

<div class="tab active" data-type="web">
Web
</div>

<div class="tab" data-type="video">
動画
</div>

<div class="tab" data-type="image">
画像
</div>

</div>

<div class="buttons">

<button onclick="searchNow()">
検索
</button>

<button onclick="lucky()">
おまかせ
</button>

</div>

</div>

<div class="shortcuts">

<div class="shortcut"
onclick="window.open('https://www.youtube.com')">
YouTube
</div>

<div class="shortcut"
onclick="window.open('https://discord.com')">
Discord
</div>

<div class="shortcut"
onclick="window.open('https://github.com')">
GitHub
</div>

<div class="shortcut"
onclick="window.open('https://chatgpt.com')">
ChatGPT
</div>

</div>

</div>

<script>

let mode="web";

document.querySelectorAll(".tab").forEach(tab=>{

tab.onclick=()=>{

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

tab.classList.add("active");

mode=tab.dataset.type;

};

});

function searchNow(){

const q=document
.getElementById("search")
.value
.trim();

if(!q) return;

saveHistory(q);

location.href=
`search.html?q=${encodeURIComponent(q)}&type=${mode}`;

}

document
.getElementById("searchForm")
.addEventListener("submit",e=>{

e.preventDefault();

searchNow();

});

function lucky(){

const sites=[
"https://www.youtube.com",
"https://github.com",
"https://chatgpt.com",
"https://discord.com"
];

window.open(
sites[Math.floor(Math.random()*sites.length)],
"_blank"
);

}

function saveHistory(text){

let history=
JSON.parse(
localStorage.getItem("wakaten_history")||"[]"
);

history.unshift(text);

history=[...new Set(history)];

history=history.slice(0,20);

localStorage.setItem(
"wakaten_history",
JSON.stringify(history)
);

loadHistory();

}

function loadHistory(){

const list=
document.getElementById("historyList");

list.innerHTML="";

const history=
JSON.parse(
localStorage.getItem("wakaten_history")||"[]"
);

history.forEach(item=>{

const div=document.createElement("div");

div.textContent=item;

div.onclick=()=>{

document.getElementById("search").value=item;

};

list.appendChild(div);

});

}

function clearHistory(){

localStorage.removeItem("wakaten_history");

loadHistory();

}

function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(
"wakaten_theme",
document.body.classList.contains("dark")
);

}

if(localStorage.getItem("wakaten_theme")==="true"){

document.body.classList.add("dark");

}

loadHistory();

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
