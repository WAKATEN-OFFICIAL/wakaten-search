<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKATEN検索</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#222;
}

header{
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    padding:15px 25px;
    position:sticky;
    top:0;
    z-index:100;
}

.top{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-size:36px;
    font-weight:bold;
    user-select:none;
}

.b{color:#4285F4;}
.r{color:#EA4335;}
.y{color:#FBBC05;}
.g{color:#34A853;}

.search{
    flex:1;
    min-width:250px;
}

.search input{
    width:100%;
    padding:14px 20px;
    border:1px solid #ddd;
    border-radius:30px;
    font-size:17px;
    outline:none;
}

.search input:focus{
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.query{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.info{
    color:#666;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.5;
}

.card button{
    margin-top:15px;
    border:none;
    background:#4285F4;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.card button:hover{
    opacity:.9;
}

.section{
    margin-top:40px;
}

.section h2{
    margin-bottom:15px;
}

.history{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tag{
    background:white;
    padding:10px 15px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.tag:hover{
    background:#4285F4;
    color:white;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:700px){

    .logo{
        width:100%;
        text-align:center;
    }

    .query{
        font-size:22px;
    }

}

.logo-link,.logo-link:link,.logo-link:visited,.logo-link:hover,.logo-link:active{
text-decoration:none !important;
color:inherit;
display:inline-block;
}
.logo{cursor:pointer;transition:.2s;}
.logo:hover{transform:scale(1.05);}

</style>
</head>

<body>

<header>

<div class="top">

<a href="./" class="logo-link"><div class="logo">
<span class="b">W</span><span class="r">A</span><span class="y">K</span><span class="b">A</span><span class="g">T</span><span class="r">E</span><span class="b">N</span>
</div></a>

<div class="search">
<input id="searchBox" placeholder="検索">
</div>

</div>

</header>

<div class="container">

<div class="query" id="query"></div>

<div class="info">
WAKATEN Search Results
</div>

<div class="grid">

<div class="card">
<h3>Google検索</h3>
<p>Googleで検索結果を開きます。</p>
<button onclick="openGoogle()">開く</button>
</div>

<div class="card">
<h3>YouTube検索</h3>
<p>YouTubeで動画を検索します。</p>
<button onclick="openYoutube()">開く</button>
</div>

<div class="card">
<h3>Wikipedia検索</h3>
<p>Wikipediaで検索します。</p>
<button onclick="openWiki()">開く</button>
</div>

<div class="card">
<h3>Googleニュース</h3>
<p>最新ニュースを検索します。</p>
<button onclick="openNews()">開く</button>
</div>

<div class="card">
<h3>画像検索</h3>
<p>Google画像検索を開きます。</p>
<button onclick="openImages()">開く</button>
</div>

<div class="card">
<h3>地図検索</h3>
<p>Googleマップで検索します。</p>
<button onclick="openMaps()">開く</button>
</div>

</div>

<div class="section">

<h2>検索履歴</h2>

<div class="history" id="history"></div>

</div>

</div>

<footer>

WAKATEN Search © 2026

</footer>

<script>

const params = new URLSearchParams(location.search);
const q = params.get("q") || "";

document.getElementById("query").textContent =
'「' + q + '」';

document.getElementById("searchBox").value = q;

document.getElementById("searchBox")
.addEventListener("keydown", e => {

if(e.key === "Enter"){

const text = e.target.value.trim();

if(text){

location.href =
"results.html?q=" +
encodeURIComponent(text);

}

}

});

let history =
JSON.parse(
localStorage.getItem("wakatenHistory")
|| "[]"
);

if(q){

history =
history.filter(x=>x!==q);

history.unshift(q);

history = history.slice(0,15);

localStorage.setItem(
"wakatenHistory",
JSON.stringify(history)
);

}

const historyDiv =
document.getElementById("history");

history.forEach(item=>{

const tag =
document.createElement("div");

tag.className = "tag";

tag.textContent = item;

tag.onclick = ()=>{

location.href =
"results.html?q=" +
encodeURIComponent(item);

};

historyDiv.appendChild(tag);

});

window.openGoogle=function(){
window.open(
"https://www.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);
}

window.openYoutube=function(){
window.open(
"https://www.youtube.com/results?search_query="+
encodeURIComponent(q),
"_blank"
);
}

window.openWiki=function(){
window.open(
"https://ja.wikipedia.org/wiki/" +
encodeURIComponent(q),
"_blank"
);
}

window.openNews=function(){
window.open(
"https://news.google.com/search?q="+
encodeURIComponent(q),
"_blank"
);
}

window.openImages=function(){
window.open(
"https://www.google.com/search?tbm=isch&q="+
encodeURIComponent(q),
"_blank"
);
}

window.openMaps=function(){
window.open(
"https://www.google.com/maps/search/" +
encodeURIComponent(q),
"_blank"
);
}

</script>

</body>
</html>
