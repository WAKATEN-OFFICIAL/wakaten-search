```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKATEN Search</title>

<style>
:root{
    --main:#00c853;
    --bg:#ffffff;
    --card:#f5f5f5;
    --text:#111111;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
}

header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:15px 25px;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    background:white;
    z-index:100;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:var(--main);
    cursor:pointer;
}

.search-form{
    flex:1;
}

.search-box{
    width:100%;
    padding:14px 20px;
    border-radius:30px;
    border:1px solid #ccc;
    font-size:16px;
    outline:none;
}

.search-box:focus{
    border-color:var(--main);
}

.tabs{
    display:flex;
    gap:10px;
    padding:15px 25px;
    border-bottom:1px solid #ddd;
}

.tab{
    padding:10px 18px;
    border-radius:20px;
    background:#eee;
    cursor:pointer;
}

.tab.active{
    background:var(--main);
    color:white;
}

.info{
    padding:15px 25px;
    color:#666;
    font-size:14px;
}

.results{
    max-width:1000px;
    margin:auto;
    padding:10px 25px 50px;
}

.result{
    padding:18px;
    margin-bottom:16px;
    border-radius:12px;
    background:var(--card);
}

.result a{
    text-decoration:none;
    color:#1565c0;
    font-size:20px;
}

.result p{
    margin-top:8px;
    color:#444;
}

.no-result{
    text-align:center;
    padding:60px;
    color:#888;
}
</style>
</head>

<body>

<header>

<div class="logo" onclick="location.href='index.html'">
WAKATEN
</div>

<form class="search-form" id="searchForm">
<input
type="text"
id="searchBox"
class="search-box"
placeholder="WAKATENで検索">
</form>

</header>

<div class="tabs">

<div class="tab active" data-type="web">
Web
</div>

<div class="tab" data-type="video">
動画
</div>

<div class="tab" data-type="image">
画像
</div>

</div>

<div class="info" id="info"></div>

<div class="results" id="results"></div>

<script>

const params=new URLSearchParams(location.search);

let query=params.get("q") || "";
let type=params.get("type") || "web";

const searchBox=document.getElementById("searchBox");
const results=document.getElementById("results");
const info=document.getElementById("info");

searchBox.value=query;

document.querySelectorAll(".tab").forEach(tab=>{

if(tab.dataset.type===type){
    tab.classList.add("active");
}else{
    tab.classList.remove("active");
}

tab.onclick=()=>{

location.href=
`search.html?q=${encodeURIComponent(query)}&type=${tab.dataset.type}`;

};

});

document.getElementById("searchForm")
.addEventListener("submit",e=>{

e.preventDefault();

const text=searchBox.value.trim();

if(!text) return;

location.href=
`search.html?q=${encodeURIComponent(text)}&type=${type}`;

});

function createResult(title,url,text){

return `
<div class="result">
<a href="${url}" target="_blank">${title}</a>
<p>${text}</p>
</div>
`;

}

function render(){

if(!query){

results.innerHTML=
'<div class="no-result">検索キーワードを入力してください</div>';

return;

}

document.title=
query+" - WAKATEN Search";

info.textContent=
`「${query}」の検索結果`;

let html="";

if(type==="web"){

html+=createResult(
"Googleで検索",
`https://www.google.com/search?q=${encodeURIComponent(query)}`,
query+" のWeb検索結果を表示"
);

html+=createResult(
"Wikipedia",
`https://ja.wikipedia.org/wiki/${encodeURIComponent(query)}`,
query+" に関連するWikipedia"
);

html+=createResult(
"YouTube",
`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`,
query+" の動画を探す"
);

}

if(type==="video"){

html+=createResult(
"YouTube",
`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`,
query+" の動画検索"
);

html+=createResult(
"ニコニコ動画",
`https://www.nicovideo.jp/search/${encodeURIComponent(query)}`,
query+" の動画検索"
);

}

if(type==="image"){

html+=createResult(
"Google画像検索",
`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`,
query+" の画像検索"
);

html+=createResult(
"Bing画像検索",
`https://www.bing.com/images/search?q=${encodeURIComponent(query)}`,
query+" の画像検索"
);

}

results.innerHTML=html;

}

render();

</script>

</body>
</html>
```
